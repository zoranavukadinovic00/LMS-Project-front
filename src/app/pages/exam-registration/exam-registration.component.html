<div class="exam-registration">
  <h2>Exam Registration</h2>

  <div class="section">
    <label for="period">Select Exam Period:</label>
    <select id="period" [(ngModel)]="selectedPeriodId" (change)="onPeriodSelected()">
      <option [value]="undefined">-- Select Period --</option>
      <option *ngFor="let period of examPeriods" [value]="period.id">
        {{ period.name }} ({{ period.startDate | date:'short' }} - {{ period.endDate | date:'short' }})
      </option>
    </select>
  </div>

  <div *ngIf="selectedPeriodId && coursesWithTerms.length > 0" class="courses-section">
    <h3>Your Enrolled Courses</h3>
    
    <div *ngFor="let cwt of coursesWithTerms" class="course-card">
      <h4>{{ cwt.course.courseName }}</h4>
      <p><strong>ESPB:</strong> {{ cwt.course.coursesEspbPoints }} | <strong>Status:</strong> {{ cwt.course.status }}</p>
      
      <div class="terms-list">
        <label>Available exam terms:</label>
        <div *ngFor="let term of cwt.availableTerms" class="term-item">
          <input 
            type="checkbox" 
            [checked]="isTermSelected(cwt.course.courseName, term.id)"
            (change)="toggleTermSelection(cwt.course.courseName, term.id)"
          />
          <span>{{ term.name }} - {{ term.examDate | date:'short' }}</span>
        </div>
      </div>
    </div>

    <button 
      class="btn-apply" 
      (click)="applyForExams()" 
      [disabled]="loading || selectedApplications.length === 0">
      {{ loading ? 'Applying...' : 'Apply for Selected Exams' }}
    </button>
  </div>

  <div *ngIf="selectedPeriodId && coursesWithTerms.length === 0" class="no-data">
    <p>No available exam terms for this period.</p>
  </div>

  <p *ngIf="message" class="success">{{ message }}</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
